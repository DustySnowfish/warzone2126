name: SpriteForge validation
on:
  push:
    paths: ['tools/spriteforge/**']
  pull_request:
    paths: ['tools/spriteforge/**']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax and JSON presets
        run: |
          python -m py_compile tools/spriteforge/spriteforge_batch.py
          python -c "import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path('tools/spriteforge').glob('*preset.json')]"
      - name: Check embedded JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('tools/spriteforge/spriteforge.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          for(const js of scripts) new Function(js);
          console.log('Checked', scripts.length, 'inline scripts');
          NODE
